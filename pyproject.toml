[project]
name = "specpilot"
version = "0.1.0"
description = "SpecPilot - an LLM evaluation platform for technical documentation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
    "mistralai>=1.0",
    "pgvector>=0.3",
    "alembic>=1.13",
    "structlog>=24.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "prometheus-client>=0.20",
]

[project.scripts]
specpilot = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) in argument defaults is the idiomatic dependency-injection pattern.
"src/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
